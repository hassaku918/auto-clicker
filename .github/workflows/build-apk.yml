name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" "$ANDROID_SDK_ROOT/licenses"
          for dir in "$ANDROID_HOME/licenses" "$ANDROID_SDK_ROOT/licenses"; do
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$dir/android-sdk-license"
            echo "84831b9409646161cecb09b7b4b3b8c5" > "$dir/android-sdk-preview-license"
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$dir/android-sdk-license"
          done
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickerBlocker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
