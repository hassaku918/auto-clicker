name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install platform
        run: |
          set -euo pipefail
          SDKMAN=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMAN" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "Using $SDKMAN"
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646161cecb09b7b4b3b8c5" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$SDKMAN" --licenses >/dev/null || true
          "$SDKMAN" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickerBlocker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
